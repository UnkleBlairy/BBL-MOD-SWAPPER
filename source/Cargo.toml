[package]
name = "teensy-fm1"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"   # links Felucca (GPL-3.0-only), see ports/felucca/NOTICE.md

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7"
teensy4-bsp = { version = "0.6.0", features = ["rt"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"
embedded-sdmmc = { version = "0.10", default-features = false }

[build-dependencies]
imxrt-rt = "0.1"
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0

[workspace]
exclude = ["host", "vendor"]
